; MELE VR config.
;
; You do not need to edit this file. Run MELE-VR.bat to pick your VR mode and image
; quality, then tune everything else in-headset with the INSERT key.
;
; This file is deliberately SHORT. Every setting the mod has (stereo separation, HUD
; layout, subtitles, comfort, head tracking) already ships with tuned defaults baked
; into the mod itself, so anything not listed here uses those. The first time you save
; from the in-game menu, the mod rewrites this file with the full list.

[active]
profile=Default

; Profile hotkeys: press one of these keys to switch settings profiles instantly, in-game.
; F1-F4 by default, deliberately NOT 1-4 (those are Mass Effect's weapon keys, and a profile
; swap mid-combat is not what you want). Rebind them in the menu's Profiles tab, or set
; enabled=0 to turn the feature off.
[hotkeys]
enabled=1
profile0=112
profile1=113
profile2=114
profile3=115

[profile:Default]
; ===== VR MODE ===== change this ONE number:  2=Stereo   1=AER   3=DIBR   0=Mono
vrMode = 2

; ----- Per-mode render resolution -----
; MELE-VR.bat writes these AND the game's own GamerSettings.ini together, and keeps them
; in sync. That matters: the mod re-asserts its remembered per-mode resolution whenever you
; switch VR mode in the menu, so if these disagreed with the game, a mode switch would
; quietly undo the quality tier you picked.
;
; Stereo renders a FULL frame per eye, so its target is NEAR-SQUARE to match the headset's
; own per-eye window: the height is the width divided by 0.964. An exactly square target
; makes every UI element about 4% too tall. If your headset's window differs, the mod prints
; the number to use on the first frame:
;   [ASPECTCHK] buffer WxH ... MISMATCH: set ResY=NNNN for ResX=NNNN
sfr2ResX = 4096
sfr2ResY = 4250
monoResX = 3840
monoResY = 2160
aerResX = 3072
aerResY = 3072
dibrResX = 3072
dibrResY = 3072

; ----- Resolution watchdog -----
; 0/0 = the installer has not run yet. MELE-VR.bat fills these in with the tier it set, and
; the mod warns in the in-game menu if the game ever resets your resolution behind your back
; (opening the game's own video options does exactly that).
expectedResX = 0
expectedResY = 0
firstRunDone = 0
